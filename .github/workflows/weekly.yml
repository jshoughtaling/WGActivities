name: Refresh and deploy

# Manual for now (Actions tab > Run workflow). When this moves to the OHDSI org, re-enable the weekly run:
#   schedule:
#     - cron: '0 11 * * 1'   # Mondays 11:00 UTC
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Each collector is independent: one failing source must not stop the build.
      # GitHub: incremental after the first (local) backfill; GITHUB_TOKEN has a low hourly limit.
      - name: Collect GitHub activity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.WG_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect/github.py

      - name: Collect forum activity
        continue-on-error: true
        run: python3 scripts/collect/forums.py

      - name: Collect community calls
        continue-on-error: true
        run: python3 scripts/collect/calls.py

      - name: Collect conference materials
        continue-on-error: true
        run: python3 scripts/collect/conference.py

      - name: Build activity.json
        run: |
          python3 scripts/build_activity.py
          python3 scripts/build_collab.py

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("rmarkdown"), repos="https://cloud.r-project.org")'

      - name: Build site
        run: Rscript build-site.R

      - name: Create .nojekyll
        run: touch docs/.nojekyll

      - name: Commit and push if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ rmd/data/activity.json rmd/data/collab.json data/events data/github_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh data and site [skip ci]"
          git pull --rebase origin main
          git push
