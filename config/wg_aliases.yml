# Regexes that identify a working group by name in free text (call titles, showcase titles/authors).
# A text can match several WGs (e.g. "Workgroup Spotlight: Eye Care & Vision Research, Rehabilitation").
# Case-insensitive. Slugs come from config/working_groups.yml.
# Deliberately narrow: bare "OMOP CDM" or "ETL" would tag nearly every research poster.
aliases:
  atlas-webapi: '\bATLAS\b|\bWebAPI\b'
  clinical-trials: '\bclinical trials? (WG|work ?group)|\bSDTM\b'
  cdm-survey: '\bCDM Survey|\bsurvey (WG|work ?group)'
  cdm-vocabulary: '(?<!Vaccine )\bVocabular(y|ies)\b'
  cdm: '\bCDM (WG|work ?group|v\d|5\.\d)|\bCDM and HADES|\bCommon Data Model (WG|work ?group)'
  data-quality: '\bData Quality (WG|work ?group)|\bDQD\b'
  education: '\bEducation\b'
  evidence-network: '\bEvidence Network\b'
  eye-care-vision: '\bEye ?care\b|\bVision (Research|WG)|\bophthalm'
  gis: '\bGIS\b|\bGeographic Information System|\bgeospatial\b|\bGaia\b'
  hades: '\bHADES\b'
  health-equity: '\bHealth Equity\b'
  health-systems: '\bHealth Systems?\b'
  industry: '\bIndustry (WG|work ?group)'
  medical-devices: '\bMedical Devices?\b'
  medical-imaging: '\bMedical Imaging\b|\bImaging (WG|work ?group)|\bDICOM\b'
  methods-research: '\bMethods (Research|WG)\b'
  nlp: '\bNatural Language Processing\b|\bNLP (WG|work ?group)'
  oncology: '\bOncology\b'
  plp: '\bPatient.Level Prediction\b|\bPLP\b'
  perinatal-reproductive: '\bPHReG\b|\bPerinatal\b|\bReproductive Health\b|\bPregnan|\bPostpartum|\bMaternal\b'
  phenotype: '\bPhenotyp|\bPhebruary\b|\bAphril\b'
  psychiatry: '\bPsychiatr'
  rare-diseases: '\bRare Diseases?\b'
  rehabilitation: '\bRehabilitation\b'
  respiratory: '\bRespiratory\b'
  reveal: '\bREVEAL\b'
  surgery-perioperative: '\bSurgery\b|\bPerioperative\b'
  themis: '\bThemis\b'
  tidy-r-omop: '\bTidy R\b'
  transplant: '\bTransplant'
  vaccine-vocabulary: '\bVaccine Vocabulary\b'
  waveform: '\bWaveform'
  women-of-ohdsi: '\bWomen of OHDSI\b|\bWoO (WG|work ?group)'
  early-stage-researchers: '\bEarly.Stage Researchers?\b|\bESR\b'
  gaia-genai: '\bLLMs?\b|\bGenerative AI\b|\bAI agents?\b|\bWill AI Help\b'
  animal-health: '\bAnimal Health\b|\bveterinar'
  dentistry: '\bDental\b|\bDentistry\b|\bperiodont'
  africa: '\bAfrica (WG|work ?group)|\bOHDSI Africa\b'
  openehr-omop: '\bopenEHR\b'
  health-economics: '\bHealth Economics\b'
