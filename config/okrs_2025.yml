# 2025 working group OKRs, mined from the four February 2025 community calls ("Phenotype Phebruary + Workgroup OKRs", Weeks 1 to 4).
# Same fields as config/okrs.yml (read that header). Text is from each week's OKR slide deck, lightly condensed; nothing here
# was reviewed by the groups. Some groups showed 2024 accomplishments and 2025 goals without formal objectives; those are
# kept as the goals the slides gave, and the accomplishments are summarized in `notes`.
# Call index: https://www.ohdsi.org/community-calls-2025/

meta:
  year: 2025
  sessions:
    a1: {date: 2025-02-04, video: "https://www.youtube.com/watch?v=FRgg0tw2G24", slides: "https://www.ohdsi.org/wp-content/uploads/2025/02/2025-OKRs-Week-1.pdf"}
    a2: {date: 2025-02-11, video: "https://www.youtube.com/watch?v=pYVd2v3cyCY", slides: "https://www.ohdsi.org/wp-content/uploads/2025/02/WG-OKRs-Week2.pdf"}
    a3: {date: 2025-02-18, video: "https://www.youtube.com/watch?v=TroiEOubu0o", slides: "https://www.ohdsi.org/wp-content/uploads/2025/02/WGs-Week3.pdf"}
    a4: {date: 2025-02-25, video: "https://www.youtube.com/watch?v=dT-4sonQzCY", slides: "https://www.ohdsi.org/wp-content/uploads/2025/02/WGs-Wk4.pdf"}

okrs:
  # ---------------- Feb 4
  - slug: health-systems
    name: Healthcare Systems Interest Group
    session: a1
    meets: Every other Monday, 9 am ET
    objectives:
      - objective: Support transforming source EHR data to the CDM
        krs:
          - '"Office hours" style agendas at the regular meetings, 10 times a year.'
          - Monitor and answer CDM Builders, Implementers and Uncategorized forum questions about source data or ETL.
      - objective: Establish a repository of community-contributed semantic mappings for use in others' ETLs (continued from 2024)
        krs:
          - Establish the repository.
          - A successful upload of a contribution.
          - A successful use of a contributed mapping in an ETL.
      - objective: Contribute to the Book of OHDSI
        krs:
          - Outline the Health System chapter and write an executive summary for each section.
          - Start writing 2 sections.

  - slug: cdm-vocabulary
    name: Vocabulary
    session: a1
    objectives:
      - objective: Support vocabulary-related activities of workgroups and contributors
        krs:
          - Hold regular office hours.
          - Talk to all WGs about their vocabulary needs.
      - objective: Increase vocabulary content and process transparency
        krs:
          - Run sessions for all proposed changes and improvements (community contributions and roadmap).
          - At least two sessions with external speakers on their experience with the vocabularies.
      - objective: Enable vocabulary-related collaboration in the community
        krs:
          - Run a race/ethnicity vocabulary-a-thon.

  - slug: perinatal-reproductive
    name: Perinatal and Reproductive Health Group (PRHeG)
    session: a1
    objectives:
      - objective: Develop, implement and disseminate a pregnancy algorithm study within the OHDSI network
        krs:
          - Finalize the protocol and share it with the Evidence Network for review.
          - Create a study package and call for participation.
          - Consolidate and analyze the evidence and submit a publication.
      - objective: Complete a network comparative effectiveness and safety study as a model for future ones
        krs:
          - Evaluate antihypertensive treatments in pregnancy (maternal effectiveness, fetal/neonatal safety) across at least 3 institutions.
      - objective: Incorporate pregnancy-specific EHR modules into the OMOP CDM
        krs:
          - "Implement ETL for the Epic Stork module at 3+ institutions with Caboodle and/or Clarity data (at least parity, gravidity, blood loss at delivery, gestational age, birthweight, Apgar at 1 and 5 minutes)."
      - objective: Train and educate perinatal and reproductive health researchers
        krs:
          - Complete the maternal health data science fellowship collaboration.
          - In-person study-a-thon at the OHDSI symposium.
          - A repository of instructional materials (videos, tutorials, guides, publications).
      - objective: Develop and share phenotypes guided by the new Maternal Health Common Data Elements
        krs:
          - Phenotypes for the first three domains (pregnancy/delivery episode; maternal conditions and outcomes; neonatal characteristics and outcomes).

  - slug: null             # the Steering Group is not in working_groups.yml
    name: Steering Workgroup
    session: a1
    leads: [Patrick Ryan, George Hripcsak]
    objectives:
      - objective: Empower workgroups to help generate evidence that promotes better health decisions and care
        krs:
          - "100% of active workgroups have a defined purpose and 2025 OKRs communicated to the community (1Q2025)."
      - objective: Create and support collaboration activities for generating and disseminating evidence
        krs:
          - "OHDSI2025 Global Symposium and regional symposia scheduled with locations and dates announced (1Q2025)."
          - "Community activities supporting the 2025 OHDSI Focus Areas with more than 50 collaborators (1Q-2Q2025)."
    notes:
      - "2025 priorities by focus area: Evidence Network engagement; community contributions to the Standardized Vocabularies; hardening Strategus and HADES and redesigning ATLAS; refreshing the Book of OHDSI and the JACC partnership."

  # ---------------- Feb 11
  - slug: methods-research
    name: Methods Research
    session: a2
    objectives:
      - objective: Promote awareness and collaboration in methods research
        krs:
          - Maintain a directory of ongoing methods research.
          - At least 6 presentations of ongoing, unpublished methods research.
          - Researchers working on at least 3 topics from the never-ending list.
      - objective: Provide resources for developing new methods
        krs:
          - Inventory options for making data sources available to methods researchers.
      - objective: Disseminate best practices informed by methods research
        krs:
          - 3 drafted manuscripts on methodological best practices.

  - slug: cdm
    name: Common Data Model
    session: a2
    meets: Tuesday, 9 am ET (the Feb 18 meeting was the next one)
    objectives:
      - objective: Lay the groundwork for the next CDM release by evaluating and refining proposed changes
        krs:
          - Decide which proposals are eligible for a new version 5-series release.
          - Get feedback from all relevant workgroups on the selected proposals.
          - Set a timeline and communication strategy for the 2026 CDM release.
      - objective: Prepare the current CDM for a new version
        krs:
          - Close all identified bugs in the repository.
          - Clean up documentation, conventions and user guides for CDM v5.4.
      - objective: Advance the maturity model for CDM extensions and expansions
        krs:
          - Identify CDM coverage gaps that Themis conventions cannot address.
          - List all extensions and expansions available in the community.
          - Define maturity levels for them.

  - slug: evidence-network
    name: OHDSI Evidence Network
    session: a2
    objectives:
      - objective: Improve communication and visibility of the Evidence Network to engage and support data partners
        krs:
          - "Build the website as a landing page with resources for data partners, a readiness decision tree and clear value propositions."
          - Write and publish a paper describing the network, as outlined in the protocol.
      - objective: Use the Evidence Network to improve the rigor and impact of network studies
        krs:
          - Improve the fitness-for-use methodology for choosing data sources for each study question.
          - Release v2.0 of data diagnostics with those improvements.
          - Use the network to find appropriate data sources for the community's prioritized 2025 study questions.

  - slug: plp
    name: Patient-Level Prediction
    session: a2
    leads: [Jenna Reps]
    meets: Monthly, 2nd Wednesday, 9 am ET
    notes:
      - "PatientLevelPrediction was already on CRAN by the call."
      - "Three or more papers were published through the WG the year before."
    objectives:
      - objective: Improve workgroup study dissemination
        krs:
          - A calendar of 2025/2026 conferences of interest, on the PLP website.
          - Use 10 minutes of each monthly call for people to discuss recent studies and publications.
          - Communicate future R package development with GitHub project tracking.
      - objective: Make the OHDSI prediction R packages easier to use
        krs:
          - User and developer survey to find bottlenecks.
          - More training (updated YouTube videos, EHDEN Academy).
          - Submit PatientLevelPrediction to CRAN in 2025.
          - New Eunomia test data suited to prediction, and a Docker container for prediction studies.
      - objective: Perform research in patient-level prediction
        krs:
          - "Journal papers on: federated learning (novel methods; federated vs single-database models), the value of other data sources (granularity, labs/imaging/NLP), temporal features, and transfer learning."

  - slug: early-stage-researchers
    name: Early-Stage Researchers
    session: a2
    leads: [Harry Reyes Nieva, Benjamin Martin, Shounak Chattopadhyay]
    meets: Monthly, 1st Thursday, 2 pm ET
    objectives:
      - objective: Align WG activities with the needs, priorities and goals of ESR members
        krs:
          - Run an annual survey of ESR needs, priorities and goals.
          - Create a strategic plan and roadmap for addressing them.
          - Report the survey at a monthly meeting and re-evaluate the OKRs.
      - objective: Foster mentorship and engagement with more experienced researchers
        krs:
          - "Monthly online talks from experienced researchers (diverse backgrounds; more than 30 participants each)."
          - Online and in-person Meet-the-Mentor roundtables, with mentees matched in advance.
          - A Mentor and Membership Directory for matchmaking.
      - objective: Facilitate involvement, visibility and networking for ESRs
        krs:
          - An onboarding roadmap for trainees across disciplines and career paths.
          - At least 5 ESR presentations or posters at OHDSI symposia.
          - Spotlight ESR members' in-progress research at monthly meetings.
      - objective: Expand the leadership structure and support global participation
        krs:
          - Recruit members to organize the monthly series, the directory and outreach.
          - Identify representatives to liaise with regional chapters.
          - Active members from at least three regional chapters.
      - objective: Grow the OHDSI network and ESR WG membership
        krs:
          - Develop ESR WG promotional materials.
          - Advertise OHDSI and the WG to institutions that have not taken part.
          - Distribute materials at non-OHDSI scientific forums aimed at ESRs.

  - slug: women-of-ohdsi
    name: Women of OHDSI
    session: a2
    objectives:
      - objective: Research data empowerment, a dedicated women's health research hub
        krs:
          - Evidence review of women's health research topics to feed OHDSI study ideas.
          - OHDSI network studies and cross-workgroup activities.
      - objective: Improve gender harmony through RWD collection and standardization
        krs:
          - Work with other WGs on the gender harmony agenda.
          - Recommendations for OMOP standardization of gender-health centricity.
      - objective: A "safe space" for all, with events, activities and workshops
        krs:
          - A planned timetable of speakers, workshops and talks.
          - Celebrate key global dates such as International Women's Day.

  - slug: atlas-webapi
    name: ATLAS / WebAPI
    session: a2
    leads: [Chris Knoll, Alexey Manoylenko]
    meets: Monthly WG 1st Tuesday 12 pm ET; weekly developer meetings on other Tuesdays
    notes:
      - "These are the Q1 2025 OKRs; the WG's mission is phenotype evaluation in the first half of 2025 and standardized analytics design in the second."
    objectives:
      - objective: Foster a collaborative environment for effective, timely ATLAS updates, community engagement and software quality
        krs:
          - Resolve the remaining 2.15 features and release in Q1 2025.
          - "WebAPI 3.0 technical upgrade (JDK 19/21, dependency updates, remove obsolete features)."
          - Engage the community on the ATLAS v4.0 redesign.
          - Create an ATLAS usage survey to find the most used functions and gaps.
      - objective: Review the framework for open-science community collaboration
        krs:
          - Protocols for requirements gathering and feature vetting.
          - Define criteria for "ready to code".
          - Establish a review process.

  # ---------------- Feb 18
  - slug: null             # APAC is a regional chapter, not a group in working_groups.yml
    name: OHDSI APAC
    session: a3
    leads: [Mui Van Zandt]
    meets: Community calls third Thursday, scientific forum first Thursday, 12 pm Korea time
    objectives:
      - objective: "Research: build research expertise and collaboration across chapters through publication"
        krs:
          - Continue and complete the 2024 APAC study (GLP-1 ALI).
          - Select and run 2-3 new APAC-led network studies.
          - Strengthen APAC presence in the Evidence Network.
      - objective: "Training: an APAC training program with more hands-on learning"
        krs:
          - Formalize an OHDSI/OMOP curriculum in APAC.
          - A community-wide ETL and/or vocabulary mapping project.
          - Support updating and localizing the Book of OHDSI.
      - objective: "Communication: collaboration activities that encourage evidence generation and sharing"
        krs:
          - Host the APAC symposium (December 6-7, Shanghai Jiao Tong University) and issue participation certificates.
          - Quarterly newsletters; monthly community calls and scientific forums.

  - slug: gaia-genai
    name: Generative AI and Foundational Models
    session: a3
    objectives:
      - objective: Promote awareness and collaboration in GenAI and foundational model research
        krs:
          - A directory of ongoing research.
          - At least 6 presentations of ongoing, unpublished work.
          - Average meeting attendance of at least 20 researchers.
          - Share at least 10 prompts with the community (with minimal evaluation criteria).
      - objective: Provide tools for AI agents (Python)
        krs:
          - Inventory of tool needs, prototype tools, evaluate across OHDSI.
      - objective: Test distributional robustness of foundational models
        krs:
          - Test publicly available foundational models across 3 OHDSI sites.

  - slug: hades
    name: HADES
    session: a3
    objectives:
      - objective: Standardize analysis input specifications with R6
        krs:
          - Implement and pilot the move to R6 objects in 3 core HADES packages.
      - objective: Centralize, standardize and version the results data model
        krs:
          - Consolidate pilot results models into a central repository (HadesResultsModel).
          - Pilot the versioned approach with CohortGenerator, Strategus, CohortMethod and CohortIncidence.
      - objective: TreatmentPatterns into HADES
        krs:
          - Evaluate and include TreatmentPatterns, and add TreatmentPatterns modules to Strategus.
      - objective: DuckDB for storage in Andromeda
        krs:
          - Finish testing Andromeda with DuckDB and adjust HADES packages as needed.
      - objective: Strategus quality and containers
        krs:
          - Unit tests in the Strategus template (verify renv.lock, run a study on synthetic data).
          - HADES container(s) and execution engine enablement.

  - slug: eye-care-vision
    name: Eye Care and Vision Research
    session: a3
    notes:
      - "2024 accomplishments included a published anti-VEGF kidney failure study, a semaglutide NAION study, uveitis phenotypes, visual field concepts submitted to LOINC, and several NEI OHDSI Challenge submissions."
    objectives:
      - objective: Complete a network study (guideline-driven evidence generation)
        krs:
          - Identify candidate network studies from preferred practice patterns.
          - Design the phenotypes.
          - Design and execute the study.
      - objective: Identify and standardize a minimum set of eye exam elements (evidence-driven data standardization)
        krs:
          - Identify the minimum elements for OMOP datamarts, including visual acuity.
          - Map the elements to concepts and implement ETLs.
      - objective: Disseminate work (evidence-driven collaborative education)
        krs:
          - Publish the workgroup's work and educate the community.

  - slug: transplant
    name: Transplant
    session: a3
    leads: [Michal Mankowski]
    meets: Every other Friday, 10 am ET
    objectives:
      - objective: Enable observational research in solid organ transplant (goals; no key results on the slides)
        krs:
          - Recruit co-leaders and WG members.
          - Identify gaps in the OMOP CDM for a Transplant extension (donor and recipient perspectives, rejection and graft events, UNOS/OPTN vocabularies).
          - Define transplant-specific phenotypes.

  - slug: null             # Latin America is a chapter, not a group in working_groups.yml
    name: Latin America
    session: a3
    objectives:
      - objective: Strengthen OMOP adoption initiatives in LATAM
        krs:
          - More than 50 people at the first LATAM OHDSI Symposium.
          - At least 10 institutions engaged in the WG.
          - At least 5 LATAM countries represented.
          - "Activities: host a LATAM event, strengthen member engagement, update and publish the SIGTAP vocabulary, translate ATLAS into Portuguese and Spanish."

  - slug: null             # a user group, not in working_groups.yml
    name: Databricks User Group
    session: a3
    leads: [John Gresh, Brad Rechkemmer]
    objectives:
      - objective: Improve integration and testing of HADES packages and other software on Databricks
        krs:
          - Most likely via StrategusStudyRepoTemplate; run automated R tests on the default database, then the same tests on Databricks.
      - objective: Update and extend online documentation for OHDSI Databricks users
        krs:
          - Review the Databricks documentation and the ATLAS/WebAPI changes; update the DatabaseOnSpark site.
      - objective: Automate environment creation and common tasks (CDM import/export, CDM tables, running Achilles)
        krs:
          - "Implemented in the Polites project, after SQL Server (done) and PostgreSQL (about 80%); Databricks about 50%."
      - objective: Improve community engagement
        krs:
          - Find ways to get more of the community contributing, and to support other workgroups.

  - slug: medical-imaging
    name: Medical Imaging
    session: a3
    leads: [Seng Chan You, Paul Nagy]
    meets: Every other Wednesday, 7 am ET then 7 pm ET
    notes:
      - "219 members; the seminal paper (Feb 2024) had 3,800 downloads; three vendors had implemented the extension, including Microsoft Azure DICOM to OMOP."
    objectives:
      - objective: "OKR 1: reference implementations of RWD into the OMOP CDM"
        krs:
          - Guideline for linking GUIDs/accession numbers to procedure occurrences.
          - Guideline on high-value DICOM tags (so the measurement table is not swamped); education on private DICOM tags.
          - Study description and series description standardization.
      - objective: "OKR 2: reference implementation on RWD in multiple locations and modalities"
        krs:
          - Commitment to reference implementations from 3 sites in 2025.
      - objective: "OKR 3: education, an implementation guide for the imaging extension"
        krs:
          - Publish the 3rd and 4th papers; a software guide for the ETL harvesting.
          - A Book of OHDSI chapter; raise awareness with grant sponsors.

  - slug: psychiatry
    name: Psychiatry
    session: a3
    meets: First Wednesday of the month, 8 am ET
    notes:
      - "2024 accomplishments: a major candidate vocabulary extension (mental health and SDoH), alignment with SNOMED and LOINC, a contribution to the Human Phenotype Ontology, and the start of a flowsheet/NLP study."
    objectives:
      - objective: 2025 goals (no formal objectives on the slides)
        krs:
          - Complete the study on the value of NLP and flowsheet data for predicting conversion from MDD to bipolar II.
          - Advance a new SNOMED concept model for mental health and align it with OMOP assessments work and HPO.
          - Run characterization and demonstration studies (who gets which assessments and treatments; lithium effect in bipolar II, Europe vs USA).
          - Help meet mental health concept needs in the community (e.g. the INSPIRE Network).

  # ---------------- Feb 25
  - slug: africa
    name: Africa Chapter
    session: a4
    leads: [Cynthia Sung, Agnes Kiragga]
    meets: Biweekly Monday, 10 am ET
    notes:
      - "Ongoing: translating the Book of OHDSI (French, Arabic, Portuguese, Swahili), Data Science without Borders, and BRIDGE PhD/postdoc training."
    objectives:
      - objective: Grant funding to expand data in the OMOP CDM
        krs:
          - Submit 2 or more grants.
      - objective: OHDSI Africa Symposium on the continent
        krs:
          - Hold it before year end (week of Nov 10, host site JCRC Kampala), with more than 100 attendees, sponsors and content.
      - objective: Deep dive on ETL and data transformation
        krs:
          - A group hands-on ETL exercise over about 2 months.
          - Identify usable data sources on the continent.
      - objective: Propose Africa-specific terminology for the OHDSI Standard Vocabulary
        krs:
          - Compare local data dictionaries with standard vocabularies (e.g. CIEL to ATHENA); at least 3 vocabularies for concept prevalence studies; a process for moving CIEL data into ATHENA.
      - objective: Learning sessions for different audiences
        krs:
          - Customized curricula for ministries of health, doctors and clinical/IT staff, with hands-on use cases.
      - objective: A maturity model for ETL implementation
        krs:
          - Outline characteristics of 4-5 maturity levels.

  - slug: rare-diseases
    name: Rare Diseases
    session: a4
    leads: [Xiaoyan Wang, Chunhua Weng]
    objectives:
      - objective: Strengthen community engagement and collaboration
        krs:
          - Form a team of about 20 active members.
          - About three knowledge-sharing sessions.
          - Partnerships with researchers, clinicians, patient advocacy groups, regulators and industry.
      - objective: Enable scalable and reproducible rare disease analytics
        krs:
          - Design and start a multi-site rare disease study on the OHDSI network.
          - A standardized approach for finding and integrating hard-to-find rare disease cohorts.
          - Release preliminary findings and methodological insights.
      - objective: Integrate innovative AI technologies for rare disease research
        krs:
          - Evaluate and implement NLP and LLMs for cohort identification.
          - Test knowledge graphs and AI-driven knowledge discovery tools.
          - Release an open-source framework or best-practices document for AI in rare disease studies.

  - slug: surgery-perioperative
    name: Surgery and Perioperative Medicine
    session: a4
    leads: [Evan Minty]
    meets: Last Wednesday of every month, 10 am ET
    objectives:
      - objective: Evidence-driven data standardization
        krs:
          - Convert existing surgical cohort assets from non-standard to standard concepts, validated by peer review and by CohortDiagnostics.
          - Contribute to LLM-enhanced and manual review of ICD10PCS to SNOMED mappings (with the Vocabulary team).
      - objective: Refine, improve and disseminate surgical and outcome cohorts
        krs:
          - Finish target surgery translation to standard concepts and the outcome cohort review, with updates to the Phenotype Library.
          - Complete a phenotype description of at least one surgical cohort as a paper.
      - objective: Complete the Surgery Incidence Rate study
        krs:
          - Specify and execute it; publish at least two incidence rate papers.
      - objective: Plan at least one surgery effect-estimation or prediction network study
        krs:
          - Background, proposed methodology and initial cohorts characterized by January 2026.
      - objective: Engage the surgery and perioperative clinical community
        krs:
          - Clinical WG work accepted at 3+ conferences; OHDSI presented at 1+ surgery conference.
          - At least 3 new members from 3 new surgery research groups.
      - objective: Promote cross-workgroup collaboration
        krs:
          - 2 strategic collaborations with other WGs and 2 joint meetings in 2025.

  - slug: gis
    name: GIS
    session: a4
    meets: Fridays, 10 am ET
    notes:
      - "Formal OKRs were not shown; the slides give 2024 accomplishments and 2025 goals."
      - "2024: released the GIS extension schema and draft GIS, Exposome and SDoH vocabularies; tested the Gaia Core schema and ETL code; built flexible cataloging and geocoding approaches."
      - "Use cases listed: climate and HIV mortality in Africa (INSPIRE), temperature and health (Boston), SDoH and intensive care (Bridge2AI), geocoding accuracy (CLAD), anaphylaxis and geospatial exposures, highway buffer zones and pulmonary outcomes."
    objectives:
      - objective: 2025 goals, infrastructure (no formal objectives on the slides)
        krs:
          - Roadmaps for Gaia, the vocabulary, cataloging, geocoding and containerization.

  - slug: nlp
    name: Natural Language Processing
    session: a4
    leads: [Hua Xu]
    objectives:
      - objective: Multi-site clinical studies using both structured and textual data
        krs:
          - "Anticancer treatment trajectories in patients receiving chemotherapy (Oncology): annotation guideline development."
          - "MDD to bipolar diagnostic transition (Psychiatry): revising the protocol."
          - "SDoH and treatment outcomes in type 2 diabetes (LEGEND-T2DM): finalizing SDoH factors and treatment-comparator-outcome pairs."
      - objective: Open-source LLMs for information extraction from clinical notes
        krs:
          - Develop Kiwi, an LLM-based clinical information extraction system, and expand it for open-source community development.
      - objective: Knowledge dissemination
        krs:
          - Monthly presentations on NLP advances (about 30 attendees on average in 2024).
          - Book of OHDSI NLP chapter, from textbook to cookbook.

  - slug: medical-devices
    name: Medical Device
    session: a4
    objectives:
      - objective: "Device ID Data subgroup (lead Asiyah Lin): deep dive into the OHDSI vocabulary for devices and procedures"
        krs:
          - Complete the medical device terminology manuscript and submit it.
          - Establish the medical device branch in the OHDSI device vocabulary.
      - objective: "Device-Generated Data subgroup (leads Andrew Williams, Manlik Kwong): a standard strategy for waveform and other device-generated data"
        krs:
          - "2024 achieved: clarified OMOP standard concept coverage gaps for 12-lead ECG and ICU monitor features, and showed a strategy for standardized analytics across EHR and waveform data."
      - objective: "Device Adverse Event subgroup (lead Michael Matheny): plan a comparative effectiveness network study"
        krs:
          - Base the plan on OHDSI site data availability and interest.

  - slug: oncology
    name: Oncology
    session: a4
    notes:
      - "2024: reviewed the oncology use case at OHDSI Europe and surveyed 26 data partners on data readiness."
    objectives:
      - objective: "Enable observational cancer research. Pillar: community support and collaboration"
        krs:
          - Update the Oncology wiki.
          - An Oncology chapter in the Book of OHDSI.
      - objective: "Pillar: a high-quality oncology OHDSI data network"
        krs:
          - Oncology data readiness assessment and fixing the impediments.
          - Use-case-driven vocabulary improvement.
      - objective: "Pillar: evidence generation"
        krs:
          - Guideline-driven evidence generation and Oncology WG studies.
          - Regular use-case repo updates.

  - slug: themis
    name: Themis
    session: a4
    meets: 1st and 3rd Thursday, 10 am ET
    objectives:
      - objective: One central location for OMOP CDM conventions
        krs:
          - Incorporate resources from other OHDSI standards; the library will contain or link to formal CDM expansions and to domain-specific WG documentation.
      - objective: A succinct list of active issues
        krs:
          - Clean up current GitHub issues (archive, de-duplicate).

  - slug: cdm-survey
    name: CDM Survey Sub-Working Group
    session: a4
    leads: [Nicole Gerlanc]
    objectives:
      - objective: Establish standardized mapping for high-use clinical surveys
        krs:
          - Identify 3-5 high-use surveys (e.g. PHQ-9, GAD-7, Asthma Control Test, SF-36, PROMIS) and write mapping guidelines.
          - Work with the Vocabulary WG on needed vocabulary; publish the mappings on GitHub.
      - objective: Enhance community engagement and contribution
        krs:
          - A repository for community survey mappings, a webinar or workshop, and a contribution guide.
      - objective: Foster collaboration with relevant groups
        krs:
          - Regular joint meetings with the Vocabulary WG; collaborations with PhenX, the HL7 Behavioral Health group and Psychiatry.
      - objective: Develop and implement mapping tools
        krs:
          - Evaluate existing tools, build a user-friendly tool, pilot on at least three survey datasets, publish a user guide.
      - objective: Secure funding and resources
        krs:
          - Identify funding sources, submit grant proposals, and partner with academic and industry stakeholders.
