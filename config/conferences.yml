# Events whose materials we collect. `kind` picks the parser in scripts/collect/conference.py.
# Dates are the first day of the event (the whole event is counted in that ISO week).
global_symposia:
  - {year: 2020, date: 2020-10-18, showcase: https://www.ohdsi.org/2020-global-symposium-collaborator-showcase/}
  - {year: 2021, date: 2021-09-12, showcase: https://www.ohdsi.org/2021-collaborator-showcase/}
  - {year: 2022, date: 2022-10-14, showcase: https://www.ohdsi.org/2022-collaborator-showcase/}
  - {year: 2023, date: 2023-10-20, showcase: https://www.ohdsi.org/2023-collaborator-showcase/}
  - {year: 2024, date: 2024-10-22, showcase: https://www.ohdsi.org/2024-collaborator-showcase/, workgroups: https://www.ohdsi.org/ohdsi2024-workgroups/, tutorials: https://www.ohdsi.org/ohdsi2024-tutorials/}
  - {year: 2025, date: 2025-10-07, showcase: https://www.ohdsi.org/2025-global-collaborator-showcase/, workgroups: https://www.ohdsi.org/ohdsi2025-workgroups/, tutorials: https://www.ohdsi.org/ohdsi2025-tutorials/}
  - {year: 2026, date: 2026-10-20, showcase: https://www.ohdsi.org/ohdsi2026-showcase/, workgroups: https://www.ohdsi.org/2026-ohdsi-symposium-workgroups/, tutorials: https://www.ohdsi.org/ohdsi2026-tutorials/}

# Regional and national events. One page per event on ohdsi.org; what a page lists varies, so `parse` says which
# parsers to run (see scripts/collect/conference.py):
#   list      "Title (authors)" entries linking to showcase-N pages (2020 pages)
#   rows      table rows "N | Title | Authors" (showcase abstract tables)
#   links     poster, slide and lightning-talk links whose link text is a title (2022-2025 APAC homepages)
#   agenda    time | program | speaker table rows (APAC 2026)
#   sessions  h4 session and tutorial headings (Africa 2025)
# An event with none of these still gets one entry, so the event appears on the heatmap and links to its page.
# `wg` is the group credited when no WG is matched from the title (Africa has its own WG; the rest go to `regional`).
regional_events:
  - {region: Europe, year: 2020, date: 2020-06-01, name: "Europe Symposium 2020 (virtual showcase)", url: "https://www.ohdsi.org/2020-european-symposium-virtual-collaborator-showcase/", parse: [list]}
  - {region: APAC,   year: 2020, date: 2020-12-05, name: "APAC Symposium 2020", url: "https://www.ohdsi.org/2020-asia-pacific-symposium-collaborator-showcase/", parse: [list]}
  - {region: Europe, year: 2022, date: 2022-06-24, name: "Europe Symposium 2022", url: "https://www.ohdsi.org/2022-european-symposium/", parse: []}
  - {region: APAC,   year: 2022, date: 2022-11-12, name: "APAC Symposium 2022", url: "https://www.ohdsi.org/2022apacsymposium/", parse: [links]}
  - {region: Europe, year: 2023, date: 2023-07-01, name: "Europe Symposium 2023", url: "https://www.ohdsi.org/europe2023-showcase/", parse: [rows]}
  - {region: APAC,   year: 2023, date: 2023-07-13, name: "APAC Symposium 2023", url: "https://www.ohdsi.org/2023apacsymposium/", parse: [links]}
  - {region: Europe, year: 2024, date: 2024-06-01, name: "Europe Symposium 2024", url: "https://www.ohdsi.org/past-events/", parse: [], note: "Rotterdam, main day June 3; no page on ohdsi.org, so the link is the past-events list"}
  - {region: APAC,   year: 2024, date: 2024-12-04, name: "APAC Symposium 2024", url: "https://www.ohdsi.org/apac2024/", parse: [links]}
  - {region: India,  year: 2024, date: 2024-10-05, name: "India Symposium 2024", url: "https://www.ohdsi.org/india2024/", parse: []}
  - {region: Europe, year: 2025, date: 2025-07-05, name: "Europe Symposium 2025", url: "https://www.uhasselt.be/en/instituten-en/biomed-en/immunology/biomedical-data-sciences/events-biomedical-data-sciences/2025-ohdsi-europe-symposium", parse: [], note: "Hasselt; no page on ohdsi.org, so the link is the host university's event page"}
  - {region: APAC,   year: 2025, date: 2025-12-08, name: "APAC Symposium 2025", url: "https://www.ohdsi.org/apac2025/", parse: [links]}
  - {region: Africa, year: 2025, date: 2025-11-10, name: "Africa Symposium 2025", url: "https://www.ohdsi.org/africa2025/", parse: [rows, sessions], wg: africa}
  - {region: Europe, year: 2026, date: 2026-04-18, name: "Europe Symposium 2026", url: "https://www.ohdsi.org/europe-symposium-2026/", parse: []}
  - {region: LATAM,  year: 2026, date: 2026-07-30, name: "Latin America Symposium 2026 (Salvador, Brazil)", url: "https://www.ohdsi.org/?p=37238", parse: [], note: "first LATAM symposium; announced in the weekly digests, no program page yet"}
  - {region: UK,     year: 2026, date: 2026-09-18, name: "OHDSI UK 2026 (Nottingham)", url: "https://www.hdruk.ac.uk/events/ohdsi-uk-2026/", parse: [], note: "hosted by HDR UK, not ohdsi.org; no abstract list published"}
  - {region: APAC,   year: 2026, date: 2026-11-13, name: "APAC Symposium 2026", url: "https://www.ohdsi.org/apac2026/", parse: [agenda]}

# `workgroups`: the symposium's WG activity day (one entry per WG session). `tutorials`: the tutorial day.
# Both pages exist for 2024-2026 only. Earlier years have a single 2022 tutorial page and no WG session
# pages; their sessions are only in agenda PDFs and forum posts (see PLAN.md).
#
# Not collected yet (different sites/structures); add parsers if the first version proves useful:
#   DevCon, Japan/Korea/China one-day events, Phenotype Phebruary
#   Global symposium agenda pages: plenaries/tutorials have slides but no WG tags (only ESR in 2026)
