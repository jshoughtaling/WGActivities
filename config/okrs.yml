# 2026 working group OKRs, mined from the Feb 17 and Feb 24 2026 OHDSI community calls ("Workgroup OKRs").
#
# Sources
#   s1  Feb 17 call  video https://www.youtube.com/watch?v=6ImY75tiAUg   slides https://www.ohdsi.org/wp-content/uploads/2026/02/Feb17-OKRs.pdf
#   s2  Feb 24 call  video https://www.youtube.com/watch?v=rmVudsoe7g4   slides https://www.ohdsi.org/wp-content/uploads/2026/02/Feb24-OKRs.pdf
#   Call index: https://www.ohdsi.org/community-calls-2026/
# Text is taken from the slides where a slide exists, and from the call transcript where it does not (FHIR to OMOP,
# APAC; marked `source: transcript`). Wording is lightly condensed, not rewritten. Nothing here has been reviewed by
# the working group leads. Only these two sessions are covered; groups that did not present have no entry.
#
# Fields
#   slug      working group slug in config/working_groups.yml, or null when the group has no entry there yet
#   name      display name as presented
#   session   s1 | s2
#   leads     as named on the slide or in the call (optional)
#   source    slides (default) | transcript
#   meets     usual meeting time, when said on the call (optional)
#   with      slugs of other groups it plans to work with (from the slides or the call; optional)
#   notes     context said on the call that is not on the slides (optional)
#   objectives  list of {objective, krs: [..]}. Slides that list bullets without "Key Result" labels put the bullets
#               under krs; slides with no explicit objective use a short objective written from the bullets' heading.

meta:
  year: 2026
  sessions:
    w26: {label: "ohdsi.org slides", date: 2026-03, video: null, slides: "https://www.ohdsi.org/workgroups/"}   # per-group deck from the ohdsi.org/workgroups page; each entry gives its own slides and date
    s1: {date: 2026-02-17, video: "https://www.youtube.com/watch?v=6ImY75tiAUg", slides: "https://www.ohdsi.org/wp-content/uploads/2026/02/Feb17-OKRs.pdf"}
    s2: {date: 2026-02-24, video: "https://www.youtube.com/watch?v=rmVudsoe7g4", slides: "https://www.ohdsi.org/wp-content/uploads/2026/02/Feb24-OKRs.pdf"}

okrs:
  - slug: cdm
    name: Common Data Model
    session: s1
    with: [cdm-vocabulary, hades, atlas-webapi]
    notes:
      - "Aims to ship v5.5 around the August 2026 vocabulary release."
      - "CDM WG liaisons contact other WGs for feedback; the timeline may slip because of the Teams outage."
    objectives:
      - objective: Release OMOP CDM v5.5 using a focused, community-validated, time-bounded process.
        krs:
          - "KR1 (Q1-Q2 2026): documented feedback on each v5.5 proposal from relevant WGs, the Technical Advisory Board and core tool/method maintainers."
          - "KR2 (mid-2026): turn feedback into explicit go / modify / defer decisions for each proposal."
          - "KR3: ship a CDM v5.5 candidate release and get Steering Committee approval, with updated DDLs, docs, R package, migration testing and a summary of community feedback."

  - slug: data-quality
    name: Data Quality
    session: s1
    with: [eye-care-vision]
    notes:
      - "KR1 was already done by the call: the Data Quality Dashboard is on CRAN."
      - "The WG was on hiatus in 2025 while the CDM team focused on v5.5 proposals."
      - "Asks other WGs for data quality checks to ship with their conventions (e.g. eye care visual acuity)."
    objectives:
      - objective: Mature the Data Quality Dashboard with a community-driven roadmap aligned with current tooling.
        krs:
          - "KR1: publish DQD on CRAN."
          - "KR2: complete and publish a landscape assessment of data quality approaches used across OHDSI (tools, workflows, dimensions), with overlaps, gaps and unmet needs."
          - "KR3: community-informed proposal for improving DQD reporting structures, including 1-2 feasible high-impact enhancements."

  - slug: evidence-network
    name: OHDSI Evidence Network
    session: s1
    with: [education]
    notes:
      - "Run as workstreams: website, study lifecycle (with CHOP) and data partner engagement."
      - "Open to anyone; you do not need to be a data partner."
    objectives:
      - objective: Professionalize and scale the Evidence Network
        krs:
          - Launch the Evidence Network website (partner onboarding, documentation, study tracking).
          - Publish a Data Partner Onboarding Playbook and governance templates.
          - Develop leadership- and industry-facing pitch materials.
          - Define sustainable funding pathways (grants, industry collaboration).
      - objective: Standardize the Evidence Network study lifecycle
        krs:
          - Define an end-to-end lifecycle (idea, feasibility, execution, synthesis).
          - Publish role definitions (Study Lead, Data Partner Lead, Local PI, Coordinating Center).
          - Release a Study Starter Kit (protocol and communications templates, governance checklist).
          - Improve visibility into active studies and partner participation.
      - objective: Enable reliable federated study execution
        krs:
          - Establish standardized execution and QA/QC workflows.
          - Define expectations for reruns, validation and issue resolution.
          - Provide clear results-submission guidance.
          - Iteratively refine guidance from real network studies.

  - slug: eye-care-vision
    name: Eye Care and Vision Research
    session: s1
    with: [gis, medical-imaging, plp, themis, data-quality, cdm-vocabulary]
    notes:
      - "Intraocular pressure conventions are done; the best recorded visual acuity ETL is being tested, with recommendations going to LOINC."
      - "Glaucoma prediction study is kicking off; imaging work links to the NIH-funded AI-READI project."
      - "The American Academy of Ophthalmology asked for a regular check-in."
      - "The WG is organized into subgroups that work asynchronously."
    objectives:
      - objective: Promote eye-focused standards within and outside OMOP
        krs:
          - Finalize ETL conventions for best recorded visual acuity (including pediatrics).
          - Formalize conventions in THEMIS.
          - Work with sites to execute the script.
          - Publish experience and promote the standards.
      - objective: Complete a network study with eye exam elements
        krs:
          - Glaucoma prediction study.
          - Design another network study with eye exam data.
          - Brainstorm a LEGEND for ophthalmology.
      - objective: Expand ophthalmic imaging capacity
        krs:
          - Demonstrate ophthalmic imaging integration using AI-READi data.
          - Develop a cross-cutting clinical informatics / imaging informatics curriculum.
      - objective: Integrate with other working groups (GIS, Medical Imaging, Patient-Level Prediction)
        krs: []
      - objective: Disseminate work
        krs:
          - Publish WG activities.
          - Educate the community.
          - Collaborate with other ophthalmic standards groups.

  - slug: psychiatry
    name: Psychiatry
    session: s2            # presented Feb 24; the slide is also in the Feb 17 PDF
    leads: [Callum Harding, Dmitry Dymshyts]
    with: [cdm-vocabulary, cdm-survey, nlp]
    notes:
      - "Looking for psychiatrists, psychologists and therapists to help map assessments, and for sites with psychometric data (claims data usually lacks it)."
    objectives:
      - objective: Expand clinical vocabulary for psychiatric assessments
        krs:
          - Classify what each instrument is used for (which diagnosis).
          - Create a list of entities and relationships to adapt into the survey model.
          - Get new assessment vocabulary accepted into SNOMED and LOINC (call: standardize the top 1,000-1,500 psychometric assessments).
      - objective: Run studies that show the need for the expanded assessment vocabulary
        krs:
          - Distribution of completed psychiatric assessments across patients with a defined diagnosis in a federated OMOP network (diagnoses to be defined).
          - Correlation between clinical outcomes for selected diagnosis categories and assessment scores (diagnoses to be defined).
      - objective: Grow engagement
        krs:
          - Run a workshop in the psychiatric research space to increase engagement with OMOP.
          - Build out the Psychiatry GitHub website and WG structure.

  - slug: hades
    name: HADES
    session: s1
    meets: Third Thursday of the month
    with: [gaia-genai, gis, oncology, medical-imaging]
    notes:
      - "Gaps in the packages come from both user experience and the team's own GenAI experiments; file GitHub issues for problems."
      - "The number of official CDM extensions is a placeholder until the work evolves."
    objectives:
      - objective: Support the design of studies using HADES/Strategus with GenAI
        krs:
          - Identify package gaps that block GenAI-assisted study design.
          - Expand code examples for characterization, estimation and prediction designs, for humans and GenAI.
          - Provide an end-to-end example from study inception to results that uses GenAI.
          - Compare vibe coding with Strategus against using HADES packages directly.
      - objective: Mature HADES packages and workflows
        krs:
          - All HADES packages tested across all supported database platforms.
          - Support OHDSI-recommended study design and results-review workflows.
          - Study results reviewable through a DuckDB backend (only Postgres supported now).
      - objective: Add support for CDM extensions
        krs:
          - Define how HADES is extended (FeatureExtraction + Circe).
          - Support n "official" extensions.

  - slug: medical-imaging
    name: Medical Imaging
    session: s1
    meets: Every two weeks, alternating 7 am and 7 pm
    with: [cdm-vocabulary, waveform, dentistry, themis, eye-care-vision]
    notes:
      - "Three sites already run the imaging extension; the stretch goal is 10."
      - "Three papers published and two in press (high-value DICOM tags; FAIR imaging research with OMOP)."
      - "A hands-on workshop for the Symposium has been proposed."
    objectives:
      - objective: "Dissemination and education (priorities: Must Have / Intend to Have / Like to Have)"
        krs:
          - "Must Have: Book of OHDSI imaging chapter."
          - "Must Have: GitHub instructions."
          - "Must Have: ETL conventions web page."
          - "Must Have: training workshop for implementing the extension."
          - "Intend to Have: DICOM/RadLex non-standard semantics into the OHDSI Vocabulary (with Vocabulary WG)."
          - "Intend to Have: DICOM Waveform, ECG to DICOM (with Waveform WG)."
      - objective: Imaging research and adoption
        krs:
          - "Like to Have: first imaging network study."
          - "Like to Have: first multi-modal network study."
          - "Like to Have: 10 sites implementing the MI extension."
          - "Like to Have: paper on feasibility of the MI-CDM in dentistry (with Dentistry WG)."

  - slug: education
    name: Education
    session: s1
    meets: Fridays, 10 am ET
    with: []
    notes:
      - "Five universities are already interested in teaching OHDSI."
      - "The community dashboard was re-engineered: it classifies publications as OHDSI-related and indexes GitHub and YouTube artifacts."
      - "The leadership program template comes from the maternal health fellowship."
    objectives:
      - objective: 2026 OKRs (objectives not labelled on the slide)
        krs:
          - Publish the 2nd edition of the Book of OHDSI.
          - Create a consortium of colleges and universities teaching OHDSI in the classroom.
          - Create a public catalog of OHDSI educational programs (annual workshops and programs; Columbia and Oxford).
          - Build a searchable, self-maintaining repository of OHDSI educational artifacts (GitHub, PubMed, YouTube) with a community dashboard.
          - Identify learning pathways and develop resources to support them.
          - Organize leadership summits for OHDSI WG leads.
          - Create a leadership development training program template for clinical working groups.

  - slug: health-systems
    name: Health Systems Interest Group
    session: s1
    with: []
    notes:
      - "An interest group, not a working group; a new co-lead joined on the call."
    objectives:
      - objective: Support transforming source EHR data to the OMOP CDM
        krs:
          - Host 6 office-hours HSIG meetings a year (first Monday of the month, starting March 2).
          - Monitor and respond to forum questions (CDM Builders, Implementers, Uncategorized).
          - Provide practical guidance on source data mapping and ETL challenges.
      - objective: Strengthen HSIG contributions to OHDSI knowledge
        krs:
          - Feed health-system use cases and lessons learned into the Book of OHDSI.
      - objective: Improve HSIG visibility and usability
        krs:
          - Reorganize and update the HSIG webpage.
          - Make resources easier to find for new and existing members.

  - slug: null             # no APAC entry in working_groups.yml; it is a regional chapter
    name: OHDSI APAC
    session: s1
    source: transcript     # presented on the call; no slide in the PDF
    with: []
    notes:
      - "Last year: three China network studies were too many at once; the Singapore GLP-1 study was being expanded; the Book of OHDSI was translated into Japanese."
    objectives:
      - objective: Make APAC more researchable (one-sentence goal for 2026), across research, training and communication pillars
        krs:
          - "Research: conduct one simple study that as many partners as possible can join (basic characterization or treatment pathway); breadth over depth. Lesson from 2025: supporting three China network studies at once was too many."
          - "Training: finalize the curriculum being built with NUS (virtual summer course, now established) and the AIDEN nationwide OMOP adoption initiative."
          - "Communication: keep community calls, newsletters and forums to link East and West; support new chapters (Indonesia filed, Thailand, Malaysia, Vietnam in the pipeline)."
          - APAC Symposium 2026 in Seoul, Korea (date to be confirmed; "sometime in November").

  - slug: cdm-vocabulary
    name: Vocabulary
    session: s2
    leads: [Anna Ostropolets]
    with: [cdm-survey, gaia-genai]
    notes:
      - "Office hours resume in March (new link on the ohdsi.org page)."
      - "Conditions mapping guidelines are live and will be shared for comment; drugs are next."
      - "The challenge answers many people independently working on LLM-assisted mapping."
    objectives:
      - objective: Support vocabulary-related activities of workgroups and contributors
        krs:
          - Hold regular office hours for vocabulary users and contributors.
          - With the Survey WG, develop and publish guidelines for survey, stage and scale, and patient-reported outcomes harmonization.
      - objective: Increase vocabulary content and process transparency
        krs:
          - Run sessions on all proposed changes and improvements (community contributions and roadmap).
          - Publish guidelines on mapping rules and assumptions for conditions, measurements, procedures and drugs.
      - objective: Enable vocabulary-related collaboration in the community
        krs:
          - With the GenAI WG, host a vocabulary mapping challenge at the OHDSI EU Symposium.

  - slug: null             # FHIR to OMOP has no entry in working_groups.yml (openehr-omop is a different group)
    name: FHIR to OMOP
    session: s2
    source: transcript
    leads: [Davera Gabriel, Jean Duteau (Dogwood Consulting), Guy Safna (Ekidna Systems)]   # names from auto-captions, spelling unchecked
    with: []
    notes:
      - "The HL7 Vulcan FHIR Accelerator meets weekly and balloted the implementation guide last year."
    objectives:
      - objective: Advance the HL7 Vulcan FHIR-to-OMOP implementation guide from balloted informative to STU (Standard for Trial Use) in the September 2026 HL7 ballot window
        krs: []
      - objective: Deepen ties between the OHDSI and HL7 communities through the Vulcan FHIR Accelerator and joint initiatives
        krs: []
      - objective: Improve OHDSI community engagement and drive adoption of the specification and tooling
        krs:
          - Show up at WG meetings, community calls and symposium presentations.

  - slug: rare-diseases
    name: Rare Diseases
    session: s2
    leads: [Xiaoyan Wang]
    with: [nlp, cdm-vocabulary]
    notes:
      - "Two panels are planned (rare disease evidence with pharma, academia and the FDA; evidence submission)."
      - "One or two real-world drug development use cases across US and EU sites, using clinical notes (about 95% of rare disease information sits only in notes)."
    objectives:
      - objective: Community engagement and collaboration
        krs:
          - Keep the collaborative team of about 20 active members.
          - Organize monthly sessions.
          - Establish partnerships with researchers, clinicians, patient advocacy groups, regulators and industry.
      - objective: Explore scalable rare disease analytics
        krs:
          - Design and start a multi-site rare disease study on the OHDSI network and OMOP CDM.
          - Develop an approach for identifying and integrating hard-to-find rare disease cohorts across sources (structured data standardization, deep clinical granularity).
          - Release preliminary findings and methodological insights.

  - slug: surgery-perioperative
    name: Surgery and Perioperative Medicine
    session: s2
    leads: [Evan Minty, Oleg Zhuk (new co-lead)]
    with: [medical-devices, waveform, plp, oncology, cdm-vocabulary]
    notes:
      - "HORUS is the surgery counterpart to How Often: large-scale incidence rates, first study on AKI."
      - "Looking for ETL expertise on the device table and surgeries."
    objectives:
      - objective: Data, vocabulary and standards
        krs:
          - Review 10K codes for the ICD10PCS to SNOMED update (Aug 2026 edition), via LLM methods and manual review.
          - Abstract on procedure mapping issues and progress (Global Symposium).
          - Further discussion of CPT pending.
      - objective: Guideline-driven evidence generation and dissemination
        krs:
          - Complete "How Often Events Unfold in Surgery"; publish HORUS-AKI and at least one other HORUS study.
          - Publish one surgery cohort phenotype description.
      - objective: Evidence consumer engagement
        krs:
          - Present at at least 3 surgery / anesthesia / perioperative conferences.
          - Involve at least 3 new members from 3 surgery / perioperative lab groups.
      - objective: OHDSI community collaboration
        krs:
          - Two strategic collaborations with other WGs (Device, Waveform, Patient-Level Prediction, Oncology), with 2 joint meetings in 2026.

  - slug: nlp
    name: Natural Language Processing
    session: s2
    leads: [Hua Xu]
    with: [psychiatry, gaia-genai]
    notes:
      - "Older packages are poorly maintained; focus is moving to LLM and agent-based extraction (e.g. Yale's KIWI, adapted to output OMOP concept IDs)."
      - "Considering a lessons-learned guide for LLM-based NLP in real-world studies (not committed)."
    objectives:
      - objective: Multi-site clinical studies using both structured and textual data
        krs:
          - "MDD to bipolar diagnostic transition predictors, retrospective network study with Psychiatry: model development."
          - "SDoH and treatment outcomes in type 2 diabetes (LEGEND-T2DM): multi-site validation of existing SDoH NLP pipelines."
      - objective: Open-source LLMs for information extraction from clinical notes
        krs:
          - Publish and open-source several information extraction pipelines.
          - Design a new AI agent-based tool for information extraction.
      - objective: Knowledge dissemination
        krs:
          - Monthly presentations on NLP advances (9 in 2025, about 30 attendees on average).

  - slug: null             # Latin America Chapter; no entry in working_groups.yml
    name: Latin America Chapter
    session: s2
    leads: [Julio Barbour Oliveira]
    with: []
    notes:
      - "2025 lesson: activities that did not match the region's maturity did not engage people, hence the regional vocabulary mapping round."
    objectives:
      - objective: Strengthen OMOP adoption initiatives in LATAM
        krs:
          - At least 100 people at the first OHDSI Latin America Symposium.
          - At least 10 institutions engaged in the chapter.
          - At least 5 LATAM countries represented.
          - "Activities: host the first Latin America Symposium, active chapter participation, one round of collective vocabulary mapping."

  - slug: oncology
    name: Oncology
    session: s2
    leads: [Asieh Golozar]
    with: [cdm-vocabulary]
    notes:
      - "The ETL on-ramp was already available for review by the end of February."
      - "FALCON-Bladder has 65 data partners interested."
      - "Subgroups: vocabulary and development, genomics/omics, outreach and research."
    objectives:
      - objective: "Enable observational cancer research. Pillar: community support and collaboration"
        krs:
          - Update the Oncology wiki with onramps for ETLers and researchers.
      - objective: "Pillar: high-quality oncology OHDSI data network"
        krs:
          - Data partner certification.
          - Continuous improvement of oncology data readiness.
          - Genomic vocabulary update.
          - Targeted, use-case-driven vocabulary update.
      - objective: "Pillar: evidence generation"
        krs:
          - Guideline-driven evidence generation, finalizing FALCON-Bladder.
          - Regular use-case repo updates.

  - slug: health-equity
    name: Health Equity
    session: s2
    leads: [Atif Adam]
    with: [gis]
    notes:
      - "Was on hiatus late 2025; 2025 OKRs were too broad, so 2026 is deliberately narrow."
      - "First meeting of the year: third week of March."
    objectives:
      - objective: Research, one population-level characterization study
        krs:
          - Define and launch one health equity characterization study on OMOP with the GIS WG, characterizing disparities using place-based and/or SDoH variables across at least one OHDSI network site.
      - objective: Engagement, at least 2 external (non-OHDSI) speakers
        krs:
          - Invite public health, social epidemiology and community health researchers to WG sessions.
      - objective: Integration, map the Health Equity x GIS shared SDoH landscape
        krs:
          - Identify overlap between place-based SDoH data needs and OHDSI geospatial infrastructure; co-define at least one operational SDoH variable for OMOP (e.g. Area Deprivation Index).

  - slug: early-stage-researchers
    name: Early-Stage Researchers
    session: s2
    leads: [Shounak Chattopadhyay, Benjamin Martin, Harry Reyes Nieva]
    with: []
    notes:
      - "Meet-the-Mentor runs in the second half of WG calls."
      - "A Symposium showcase checkbox and a separate ESR award exist."
    objectives:
      - objective: Foster mentorship and engagement with more experienced researchers
        krs:
          - Monthly online and annual in-person Meet-the-Mentor roundtables and talks.
      - objective: Facilitate involvement, visibility and networking for ESRs
        krs:
          - At least 5 ESR presentations or posters at OHDSI symposia.
          - Spotlight ESR members' in-progress research at monthly meetings.
      - objective: Expand the leadership structure and support global participation
        krs:
          - Identify representatives to liaise with regional chapters.
          - Expand membership to include active members from at least three regional chapters.

  # ---- groups whose 2026 OKRs are on the ohdsi.org/workgroups page ("OKR Slides") but not in the two February calls
  - slug: gis
    name: GIS
    session: w26
    slides: "https://www.ohdsi.org/wp-content/uploads/2026/03/GIS-2026.pdf"
    date: 2026-03
    with: [hades]
    objectives:
      - objective: Release a stable "working beta" of the Gaia toolchain
        krs:
          - "Key result: a deployable version with no workflow-breaking bugs and a stable PostgREST API layer. Priority is core functionality (ingestion, pipeline execution); connectors are secondary."
          - "Target: early May 2026, to allow summer testing ahead of the October Global Symposium."
      - objective: Ensure location_history and external_exposure tables meet the forthcoming OHDSI extension requirements
        krs:
          - "Deliverables: extension tables plus documentation and tooling that meet the formal requirements (DQD checks as SQL/R, transformation examples including a documented workflow to external_exposure, analytical tools built on the extension tables)."
          - "Target: June 2026."
      - objective: Demonstrate a reproducible workflow using GIS data within the OHDSI stack
        krs:
          - "Workflow established with CaprForExtensions and FeatureExtractionForExtensions. Depends on synthetic data (environmental and socioeconomic factors linked to respiratory disease) posted to the GIS repo."
          - "Target: present at OHDSI Europe, expand to a showcase at OHDSI Global."
      - objective: Validate the whole workflow with real-world data across multiple sites
        krs:
          - "A completed pilot is the proof of value for a strong GIS manuscript. Candidate sources: CHoRUS (Bridge2AI), MUSC/VA Rural Program (strong candidate), CODATA real-world sensor data (Dhaka/Douala)."
          - "Target: October 2026."

  - slug: waveform
    name: Waveform
    session: w26
    slides: "https://www.ohdsi.org/wp-content/uploads/2026/03/Waveform-2026.pdf"
    date: 2026-03
    objectives:
      - objective: External evaluation of the extension tables and further refinement
        krs:
          - "Key result: a tested and agreed specification for the extension tables, ideally with examples. Multiple partners with different objectives test the proposed tables and look for issues and missing pieces."
          - "Target: end of March 2026, to allow summer testing ahead of the October Global Symposium."
      - objective: Follow the newly established conventions for formalizing OMOP extensions
        krs:
          - "Deliverables: extension tables plus documentation and tooling that meet the formal requirements (DQD checks as SQL/R, transformation examples with a documented workflow, analytical tools, synthetic data)."
          - "Target: June 2026."
      - objective: Demonstrate waveform extension table integration
        krs:
          - "Workflow established with CaprForExtensions and FeatureExtractionForExtensions (dependency: synthetic data posted to the Waveform repo)."
          - "Target: present at OHDSI Europe, expand to a showcase at OHDSI Global."
      - objective: Initial multi-site demonstration of waveform data alongside OMOP in a study
        krs:
          - "A completed pilot is the proof of value for a strong Waveform WG manuscript. Candidate sources: CHoRUS (Bridge2AI) and INDICATE (federated intensive care data)."
          - "Target: October 2026."

  - slug: phenotype
    name: Phenotype Development and Evaluation
    session: w26
    slides: "https://www.ohdsi.org/wp-content/uploads/2026/08/Phenotype-2026.pdf"
    date: 2026-08
    with: [gaia-genai]
    objectives:
      - objective: Advance the science of AI-assisted systematic phenotyping (shared with the AI working group)
        krs:
          - "KR1.1: run Phenotype Phebruary to help benchmark an iterative, empirically grounded, AI-assisted workflow across diverse RWD network sources, by Q1 2026."
          - "KR1.2: finalize and submit the \"Minds Meet Machines\" manuscript to a high-impact informatics journal, by Q1 2026."
          - "KR1.3: develop a gold standard of phenotype algorithms for a specific data source, to evaluate independent phenotype development or evaluation pipelines, by Q3 2026."
          - "KR1.4: develop, test and validate a robust AI-assisted pipeline for developing clinical phenotypes, by September 2026."
          - "KR1.5: populate the Phenotype Library with at least 100 new AI-assisted phenotypes and demo the learning at the Global Symposium."
      - objective: OHDSI Library integration
        krs:
          - "KR2.1: publish a peer-reviewed communication establishing inter-library metadata standards (lead: VA CIPHER), by Q2 2026."
          - "KR2.2: refactor the Phenotype Library submission architecture to require the new metadata ontologies, by Q4 2026."

  - slug: animal-health
    name: Electronic Animal Health Records
    session: w26
    slides: "https://www.ohdsi.org/wp-content/uploads/2026/03/EAHR-2026.pdf"
    date: 2026-03
    with: [themis, medical-imaging, waveform]
    notes:
      - "The slides call these 2026 OKRs \"proposed\"."
    objectives:
      - objective: Propose solutions to support use of animal health data for research in veterinary and human medicine
        krs:
          - Analyze OHDSI components (CDM, Vocabulary) as they relate to animal health data.
          - Document conventions and modifications needed to ETL animal data (methods, guidelines, experiences).
          - Show documentation and SOPs on the WG GitHub repository, and submit conventions to the Themis repository.
          - Contribute veterinary-specific guidance to OHDSI "getting started" materials.
      - objective: Complete a pilot data harmonization project to show consensus and feasibility of the proposed veterinary solutions
        krs:
          - Develop a multi-domain research question that needs multi-institution data harmonization.
          - Retrieve and report data from each veterinary site using uniform processes.
          - Begin a manuscript on the findings.
      - objective: Evaluate the imaging and waveform CDM extensions in a veterinary context
        krs:
          - Implement popular CDM extensions at veterinary sites.
          - Document recommended conventions, structural changes and custom terminology updates.

  - slug: cdm-survey
    name: CDM Survey Sub-Working Group
    session: w26
    slides: "https://www.ohdsi.org/wp-content/uploads/2026/03/Survey-2026.pdf"
    date: 2026-03
    meets: Every other Tuesday, 10 am ET
    objectives:
      - objective: Establish best practices and standards for survey data modeling in the OMOP CDM
        krs:
