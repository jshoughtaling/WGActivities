# Working group -> GitHub repo mapping (DRAFT, generated 2026-11-07 from the 397 public repos in github.com/OHDSI).
#
# Method: repo name, description, topics and last-push date, matched against the WG list on
# https://www.ohdsi.org/workgroups/. Nothing here comes from the WGs themselves, so every
# mapping needs WG-lead review. GitHub org team membership was not readable (403).
#
# Conventions
#   repos:       each repo has ONE primary WG. Explicit listing beats `topic_rules`.
#   also:        repos that a second WG plausibly shares. Not counted in the primary rollup.
#   confidence:  high   = repo is the WG's own repo or named for it
#                medium = purpose clearly fits the WG
#                low    = a guess from the description; check before relying on it
#   topic_rules: GitHub topics that assign any not-explicitly-listed repo to this WG.
#   forum_categories / teams_channel: TODO, filled in a later step.
#   non-WG buckets (`infrastructure`, `chapters`, `studies_and_apps`, `etl`) are tracked
#   separately and shown only if we decide to include them.

